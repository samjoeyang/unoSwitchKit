name: CI Probe (排查用，用完删除)

# 控制实验：极简 workflow，无 concurrency、无编译、不依赖任何 secret。
# 若它也被秒取消 → 坐实「有外部 actor 在取消账号下所有新 run」
# 若它能跑满 → 问题在 build.yml 自身（concurrency / 某 step）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 空跑探测
    runs-on: ubuntu-latest
    steps:
      - name: 空跑 45 秒，给外部取消留出时间窗口
        run: |
          echo "probe start at $(date -u +%H:%M:%S)"
          sleep 45
          echo "probe done at $(date -u +%H:%M:%S) —— 若看到这行说明未被外部取消"
