name: CI Probe 2 (macOS+write+secrets, no compile)

# 隔离实验：复刻 build.yml 的 runs-on/permissions/env(secrets)，但只 echo、不编译、不调 action。
# 若被秒取消 → 问题在 macos-14 / write 权限 / secrets env 引用
# 若能跑完 → 问题在 build.yml 的第三方 action 或编译步骤
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "10.14"
  OTA_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
  SWITCHKIT_UPDATE_ENDPOINTS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) || '' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  probe:
    name: macOS 空跑探测（复刻 env/权限，仅 echo）
    runs-on: macos-14
    steps:
      - name: 空跑 30 秒
        run: |
          echo "probe2 start at $(date)"
          echo "OTA_ENABLED=$OTA_ENABLED"
          sleep 30
          echo "probe2 done —— 若看到这行说明未被取消"
