name: CI Probe 3b (ubuntu, write, secrets env)
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  OTA_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
  SWITCHKIT_UPDATE_ENDPOINTS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) || '' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "probe3b start $(date)"
          echo "OTA_ENABLED=$OTA_ENABLED"
          sleep 30
          echo "probe3b done —— 若看到这行说明 write 权限/secrets-env 非根因"
